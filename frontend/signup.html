<!DOCTYPE html>
<html>
<head>
    <title>Campus Connect - Signup</title>
    <link rel="stylesheet" href="stylecampus.css">
</head>

<body>

    <h1>Campus Connect</h1>
    <h2>Signup</h2>

    <form id="signupForm" novalidate>

        <p id="signupError" class="error-message"></p>

        <label>Name</label><br>
        <input type="text" id="signupName" placeholder="Enter your name"><br><br>

        <label>Email</label><br>
        <input type="email" id="signupEmail" placeholder="Enter your email"><br><br>

        <label>Password</label><br>
        <input type="password" id="signupPassword" placeholder="Create a password"><br><br>

        <label>Confirm Password</label><br>
        <input type="password" id="confirmPassword" placeholder="Confirm your password"><br><br>

        <button type="submit">Signup</button>

        <p>Already have an account?</p>
        <a href="login.html">Login here</a>

    </form>

    <script src="validation.js"></script>

</body>
</html>
