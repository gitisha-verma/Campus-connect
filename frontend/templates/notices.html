<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Connect - Notices</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/notices.css') }}">
</head>

<body>

    <div class="notices-container">

        <aside class="sidebar">
            <h1>Campus Connect</h1>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Events</a>
                <a href="#">Notices</a>
                <a href="#">Resources</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <main class="main-content">

            <section class="notices-header">
                <h2>Campus Notices</h2>
                <p>Stay updated with the latest information from your college.</p>

                <input
                    type="text"
                    id="noticeSearch"
                    placeholder="Search notices..."
                >

                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="Examination">Examination</option>
                    <option value="Holiday">Holiday</option>
                    <option value="Scholarship">Scholarship</option>
                </select>
            </section>

            <section class="notices-list" id="noticesContainer">
                <!-- Notices will be loaded from the database using JavaScript -->
            </section>

            <p id="noNoticesMessage" style="display: none;">
                No notices found.
            </p>

        </main>

    </div>

    <script src="{{ url_for('notices_js') }}"></script>
</html>
