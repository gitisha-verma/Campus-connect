<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Connect Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <div class="dashboard-container">

        <aside class="sidebar">
            <h1>Campus Connect</h1>

            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/events">Events</a>
                <a href="/notices">Notices</a>
                <a href="/resources">Resources</a>
                <a href="/discussion">Discussion Board</a>
                <a href="/profile">Profile</a>
                <a href="/logout">Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <section class="welcome-section">
                <h2>Welcome, <span id="student-name">Student</span>!</h2>
                <p>Here is what is happening on campus today.</p>
            </section>

            <section class="summary-cards">

                <div class="card">
                    <h3>Upcoming Events</h3>
                    <p id="event-count">0 Events</p>
                </div>

                <div class="card">
                    <h3>Latest Notices</h3>
                    <p id="notice-count">0 New Notices</p>
                </div>

                <div class="card">
                    <h3>Study Resources</h3>
                    <p id="resource-count">0 Resources</p>
                </div>

            </section>

            <section class="dashboard-sections">

                <div class="content-box">
                    <h2>Upcoming Events</h2>
                    <div id="upcoming-events"></div>
                </div>

                <div class="content-box">
                    <h2>Latest Notices</h2>
                    <div id="latest-notices"></div>
                </div>

            </section>
        </main>

    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
