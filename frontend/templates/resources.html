<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Connect - Resources</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/resources.css') }}">
</head>

<body>

    <div class="resources-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h1>Campus Connect</h1>

            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/notices">Notices</a>
                <a href="/events">Events</a>
                <a href="/resources">Resources</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Page Header -->
            <section class="resources-header">
                <h2>Campus Resources</h2>
                <p>
                    Find useful academic and college resources to support
                    your learning and campus experience.
                </p>
            </section>

            <!-- Search Controls -->
            <section class="resources-controls">

                <div class="search-box">
                    <label for="resource-search">Search Resources</label>
                    <input
                        type="text"
                        id="resource-search"
                        placeholder="Search resources..."
                    >
                </div>

            </section>

            <!-- Resources List -->
            <section class="resources-list" id="resources-list">
            </section>

        </main>

    </div>

    <script src="{{ url_for('static', filename='js/resources.js') }}"></script>

</body>
</html>
