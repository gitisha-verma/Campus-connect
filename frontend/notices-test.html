<!DOCTYPE html>
<html lang="en">
<head>

    <title>Notices Test</title>
</head>
<body>

    <h1>Campus Connect - Notices</h1>

    <input
        type="text"
        id="noticeSearch"

    </p>

    <script src="notices.js"></script>

</html>
